{% extends "base.html" %}

{% block titulo %}Inicio{% endblock %}

{% block contenido %}
  <section class="mb-12">
    <h1 class="text-4xl font-extrabold tracking-tight md:text-5xl">Ideas y aprendizajes</h1>
    <p class="mt-3 text-stone-400">Un blog para escribir lo que voy descubriendo.</p>
  </section>

  <div class="space-y-6">
    {% for articulo in articulos %}
      <article class="rounded-2xl border border-white/10 bg-white/5 p-6 transition hover:-translate-y-1 hover:border-brand-500">
        <p class="text-xs font-semibold uppercase tracking-widest text-brand-400">{{ articulo.fecha }}</p>
        <h2 class="mt-2 text-xl font-bold">
          <a href="/articulo/{{ articulo.id }}" class="hover:text-brand-400">{{ articulo.titulo }}</a>
        </h2>
        <p class="mt-2 text-sm text-stone-400">{{ articulo.resumen }}</p>
      </article>
    {% endfor %}
  </div>
{% endblock %}
