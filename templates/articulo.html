{% extends "base.html" %}

{% block titulo %}{{ articulo.titulo }}{% endblock %}

{% block contenido %}
  <a href="/" class="text-sm text-stone-400 transition hover:text-white">← Volver al inicio</a>

  <article class="mt-8">
    <p class="text-xs font-semibold uppercase tracking-widest text-brand-400">{{ articulo.fecha }}</p>
    <h1 class="mt-3 text-4xl font-extrabold tracking-tight md:text-5xl">{{ articulo.titulo }}</h1>
    <p class="mt-4 text-lg text-stone-400">{{ articulo.resumen }}</p>

    <div class="mt-10 border-t border-white/10 pt-10 leading-relaxed text-stone-300">
      {{ articulo.contenido }}
    </div>

    <div class="mt-12 flex items-center gap-4 border-t border-white/10 pt-6">
      <a href="/admin/editar/{{ articulo.id }}"
        class="rounded-xl border border-white/10 px-5 py-2 text-sm font-semibold transition hover:bg-white/5">Editar</a>

      <form method="POST" action="/admin/borrar/{{ articulo.id }}"
        onsubmit="return confirm('¿Seguro que quieres borrar este artículo?');">
        <button type="submit"
          class="rounded-xl border border-red-500/40 px-5 py-2 text-sm font-semibold text-red-400 transition hover:bg-red-500/10">Borrar</button>
      </form>
    </div>

  </article>
{% endblock %}
