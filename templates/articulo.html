{% extends "base.html" %}

{% block titulo %}{{ articulo.titulo }}{% endblock %}

{% block contenido %}
  <a href="/" class="text-sm text-stone-400 transition hover:text-white">← Volver al inicio</a>

  <article class="mt-8">
    <p class="text-xs font-semibold uppercase tracking-widest text-brand-400">{{ articulo.fecha }}</p>
    <h1 class="mt-3 text-4xl font-extrabold tracking-tight md:text-5xl">{{ articulo.titulo }}</h1>
    <p class="mt-4 text-lg text-stone-400">{{ articulo.resumen }}</p>

    <div class="mt-10 border-t border-white/10 pt-10 leading-relaxed text-stone-300">
      {{ articulo.contenido }}
    </div>
  </article>
{% endblock %}
